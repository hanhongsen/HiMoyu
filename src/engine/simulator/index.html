<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HiMoyu 模拟互动台 · 阶段 2A</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>HiMoyu 模拟互动台</h1>
      <p>阶段 2A · 员工入职系统联调 · 本地 Demo · 不连接抖音</p>
    </div>
    <div id="connStatus" class="status status--off">
      <span class="dot"></span>
      <span id="connText">连接中</span>
    </div>
  </header>

  <main class="layout">
    <!-- ========== 用户身份 ========== -->
    <section class="card">
      <h2>模拟观众</h2>
      <p class="hint">同一 user_id 代表同一位观众；昵称仅用于展示。</p>
      <label>用户标识
        <input id="userId" type="text" value="demo-user-1" maxlength="64">
      </label>
      <label>昵称
        <input id="nickname" type="text" value="摸鱼小王" maxlength="32">
      </label>
      <div class="hint" id="userLikeHint">当前累计点赞：0 / 10</div>
    </section>

    <!-- ========== 免费互动 ========== -->
    <section class="card">
      <h2>免费互动（10 个点赞即可入职）</h2>
      <div class="row">
        <button id="btnLike1" class="btn">点赞 +1</button>
        <button id="btnLike5" class="btn">点赞 +5</button>
        <button id="btnLike10" class="btn">点赞 +10</button>
      </div>
      <label class="inline">评论内容（默认"入职"触发入职）
        <input id="commentText" type="text" value="入职" maxlength="32">
      </label>
      <button id="btnComment" class="btn btn--wide">发送评论</button>
    </section>

    <!-- ========== 礼物互动 ========== -->
    <section class="card">
      <h2>礼物互动</h2>
      <div class="row">
        <select id="giftSelect">
          <option value="demo_entry_gift">入职礼物（触发入职）</option>
          <option value="gift_phone">手机（不触发入职）</option>
          <option value="gift_snack">零食（不触发入职）</option>
          <option value="gift_coffee">咖啡（不触发入职）</option>
          <option value="gift_alarm">闹钟（不触发入职）</option>
          <option value="gift_file">文件（不触发入职）</option>
        </select>
        <button id="btnGift" class="btn">送出</button>
      </div>
    </section>

    <!-- ========== 场次状态 ========== -->
    <section class="card card--state">
      <div class="state-head">
        <h2>场次状态</h2>
        <button id="btnReset" class="btn btn--ghost">重置场次</button>
      </div>
      <div class="metrics">
        <div class="metric"><span>工位</span><strong id="seatUsage">0 / 25</strong></div>
        <div class="metric"><span>空闲</span><strong id="freeSeats">25</strong></div>
        <div class="metric"><span>排队</span><strong id="queueCount">0</strong></div>
        <div class="metric"><span>版本</span><strong id="stateVersion">0</strong></div>
        <div class="metric"><span>点赞</span><strong id="countLike">0</strong></div>
        <div class="metric"><span>评论</span><strong id="countComment">0</strong></div>
        <div class="metric"><span>礼物</span><strong id="countGift">0</strong></div>
      </div>
      <div class="last-event">
        <span>最近事件</span>
        <strong id="lastEvent">暂无</strong>
      </div>

      <h3 style="margin-top:14px;font-size:14px;">25 工位视图</h3>
      <div id="seatGrid" class="seat-grid"></div>

      <h3 style="margin-top:14px;font-size:14px;">已入职员工（按工位编号）</h3>
      <div id="employeeList" class="employee-list"><p class="hint">暂无员工</p></div>

      <h3 style="margin-top:14px;font-size:14px;">等待队列（按先后顺序）</h3>
      <div id="queueList" class="queue-list"><p class="hint">队列为空</p></div>
    </section>

    <!-- ========== 员工离场（本地测试用） ========== -->
    <section class="card">
      <h2>员工离场（本地测试用）</h2>
      <div class="row">
        <label class="inline">工位编号 (1-25)
          <input id="leaveSeat" type="number" min="1" max="25" value="1" style="width:60px">
        </label>
        <button id="btnLeave" class="btn btn--danger">模拟离场</button>
      </div>
      <p class="hint">离场后如果有人排队，队首自动补位。</p>
    </section>

    <!-- ========== 操作日志 ========== -->
    <section class="card card--log">
      <h2>操作记录</h2>
      <div id="eventLog" class="log"><p class="hint">等待操作……</p></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
